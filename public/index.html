<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C81010" />

    <!-- Fallback SEO (overridden per-page by react-helmet-async) -->
